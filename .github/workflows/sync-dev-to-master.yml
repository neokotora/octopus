name: sync-dev-to-master

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: sync-dev-to-master
  cancel-in-progress: true

jobs:
  sync:
    name: Merge dev into master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev

      - name: Ensure ACTION_TOKEN exists
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          if [ -z "$ACTION_TOKEN" ]; then
            echo "::error::Missing ACTION_TOKEN secret. Add a PAT with repo scope to allow push and trigger downstream workflows."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

      - name: Merge dev into master
        run: |
          git fetch origin master dev
          git checkout -B master origin/master
          if ! git merge --no-ff --no-edit -X theirs origin/dev; then
            git checkout --theirs .
            git add -A
            git commit --no-edit
          fi

      - name: Push updated master
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${ACTION_TOKEN}@github.com/${{ github.repository }}
          git push origin master

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### dev -> master 同步失败"
            echo "- 自动合并 origin/dev 到 origin/master 失败，可能是代码冲突或权限不足。"
            echo "- 请先手动解决冲突，或检查 ACTION_TOKEN 权限后重试。"
          } >> "$GITHUB_STEP_SUMMARY"
